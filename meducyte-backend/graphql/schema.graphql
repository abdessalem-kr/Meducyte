  updateQuestion(id: ID!, text: String, source_exam: String, tags: [String!], estimated_time: Int, approved: Boolean): Question! @update(model: "App\\Models\\Learn\\Question")
  deleteQuestion(id: ID! @eq): Question @delete(model: "App\\Models\\Learn\\Question")

