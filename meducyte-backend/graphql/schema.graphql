type QuestionComment {
  id: ID!
  user: User!
  question_id: ID!
  parent_id: ID
  text: String!
  is_edited: Boolean!
  upvotes: Int!
  downvotes: Int!
  my_vote: Int @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@myVote")
  is_mine: Boolean! @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@isMine")
  replies: [QuestionComment!]! @hasMany
  created_at: DateTime!
}

type AnswerResult {
  isCorrect: Boolean!
  correctPropositionId: ID
  explanation: String
}

type QuestionFolder @model(class: "App\\Models\\Learn\\QuestionFolder") {
  id: ID!
  user_id: ID!
  name: String!
  color: String
  user: User! @belongsTo
  savedQuestions: [SavedQuestion!]! @hasMany
  created_at: DateTime!
  updated_at: DateTime!
}

type SavedQuestion @model(class: "App\\Models\\Learn\\SavedQuestion") {
  id: ID!
  user_id: ID!
  userId: ID @rename(attribute: "user_id")
  question_id: ID!
  questionId: ID @rename(attribute: "question_id")
  folder_id: ID
  folderId: ID @rename(attribute: "folder_id")
  user: User! @belongsTo
  question: Question! @belongsTo
  folder: QuestionFolder @belongsTo
  created_at: DateTime!
  updated_at: DateTime!
}

type Notification {
  id: ID!
  title: String!
  body: String!
  type: String!
  data: JSON
  isRead: Boolean!
  createdAt: DateTime!
}

type SubTask @model(class: "App\\Models\\SubTask") {
    id: ID!
    todo_item_id: ID! @rename(attribute: "todo_item_id")
    title: String!
    is_completed: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type TodoItem @model(class: "App\\Models\\TodoItem") {
    id: ID!
    user: User! @belongsTo
    title: String!
    priority: String!
    deadline: DateTime
    is_completed: Boolean!
    module_id: String
    estimated_pomodoros: Int!
    completed_pomodoros: Int!
    subtasks: [SubTask!]! @hasMany
    created_at: DateTime!
    updated_at: DateTime!
}

type ExamEvent @model(class: "App\\Models\\ExamEvent") {
    id: ID!
    user: User! @belongsTo
    title: String!
    date: DateTime!
    created_at: DateTime!
    updated_at: DateTime!
}

type PomodoroSession @model(class: "App\\Models\\PomodoroSession") {
    id: ID!
    user: User! @belongsTo
    type: String!
    duration_minutes: Int!
    started_at: DateTime!
    completed_at: DateTime
    status: String!
    todo_item: TodoItem @belongsTo
}

type ProductiveBayStats {
    focus_hours_today: Float!
    focus_hours_week: Float!
    completed_tasks_today: Int!
    current_streak: Int!
    pomodoros_completed_today: Int!
}

type UserSetting {
    id: ID!
    pomodoro_work_duration: Int!
    pomodoro_short_break: Int!
    pomodoro_long_break: Int!
    pomodoro_sessions_until_long_break: Int!
}

type PomodoroHistory {
    id: ID!
    type: String!
    duration_minutes: Int!
    started_at: DateTime!
    completed_at: DateTime
    status: String!
    todo_item: TodoItem
}

input SubTaskInput {
    id: ID
    title: String!
    is_completed: Boolean
}

extend type Query {
    todoItems: [TodoItem!]! @guard @all
    examEvents: [ExamEvent!]! @guard @all
    productiveBayStats: ProductiveBayStats! @guard @field(resolver: "App\\GraphQL\\Resolvers\\ProductiveBayResolver@stats")
    userSettings: UserSetting! @guard @field(resolver: "App\\GraphQL\\Resolvers\\UserSettingsResolver@getSettings")
    pomodoroHistory(limit: Int = 10): [PomodoroHistory!]! @guard @field(resolver: "App\\GraphQL\\Resolvers\\ProductiveBayResolver@history")
}

extend type Mutation {
    createTodo(title: String!, priority: String, deadline: DateTime, module_id: String, estimated_pomodoros: Int, subtasks: [SubTaskInput]): TodoItem! @guard @field(resolver: "App\\GraphQL\\Resolvers\\ProductiveBayResolver@createTodo")
    updateTodo(id: ID!, title: String, priority: String, deadline: DateTime, is_completed: Boolean, completed_pomodoros: Int, estimated_pomodoros: Int, subtasks: [SubTaskInput]): TodoItem! @guard @field(resolver: "App\\GraphQL\\Resolvers\\ProductiveBayResolver@updateTodo")
    deleteTodo(id: ID! @eq): TodoItem @guard @delete(model: "App\\Models\\TodoItem")
    createExam(title: String!, date: DateTime!): ExamEvent! @guard @field(resolver: "App\\GraphQL\\Resolvers\\ProductiveBayResolver@createExam")
    updateExam(id: ID!, title: String, date: DateTime): ExamEvent! @guard @field(resolver: "App\\GraphQL\\Resolvers\\ProductiveBayResolver@updateExam")
    deleteExam(id: ID!): ExamEvent @guard @delete
    logPomodoroSession(type: String!, duration_minutes: Int!, started_at: DateTime!, status: String, todo_item_id: ID): PomodoroSession! @guard @field(resolver: "App\\GraphQL\\Resolvers\\ProductiveBayResolver@logPomodoro")
    updatePomodoroSettings(work_duration: Int, short_break: Int, long_break: Int, sessions_until_long: Int): UserSetting! @guard @field(resolver: "App\\GraphQL\\Resolvers\\UserSettingsResolver@updateSettings")
}
