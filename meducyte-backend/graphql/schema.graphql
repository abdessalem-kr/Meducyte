  updateProposition(id: ID!, label: String, text: String, is_correct: Boolean): Proposition! @update(model: "App\\Models\\Learn\\Proposition")
  deleteProposition(id: ID! @eq): Proposition @delete(model: "App\\Models\\Learn\\Proposition")

