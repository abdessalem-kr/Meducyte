    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\ParagraphNoteResolver@delete")

  addQuestionImageComment(
    question_id: ID!
    google_drive_file_id: String!
    google_drive_web_view_link: String!
    thumbnail_url: String
    caption: String
  ): QuestionImageComment!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuestionImageCommentResolver@add")

  deleteQuestionImageComment(id: ID!): Boolean!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuestionImageCommentResolver@delete")

  markNotificationAsRead(id: ID!): Notification
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\NotificationResolver@markAsRead")

  deleteNotification(id: ID!): Boolean!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\NotificationResolver@delete")

  toggleSaveQuestion(questionId: ID!, folderId: ID): Boolean!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\SavedQuestionResolver@toggle")

  createQuestionFolder(name: String!, color: String): QuestionFolder!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuestionFolderResolver@create")

  deleteQuestionFolder(id: ID!): Boolean!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuestionFolderResolver@delete")

  renameQuestionFolder(id: ID!, name: String!, color: String): QuestionFolder!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuestionFolderResolver@rename")

  # NEW: Quiz answer submission
  submitAnswer(
    questionId: ID!
    propositionId: ID!
  ): AnswerResult! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuizResolver@submit")

  # NEW: Quiz session batch synchronization
  syncQuizSession(
    sessionId: String!
    results: JSON!
  ): Boolean! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuizResolver@sync")

  syncReview(
    question_id: ID!
    interval: Int!
    ease_factor: Float!
    repetition_count: Int!
    next_review: DateTime!
    last_review: DateTime
  ): QuestionReview! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuizResolver@syncReview")

  # NEW: Interaction Mutations
  addQuestionComment(question_id: ID!, text: String!, parent_id: ID): QuestionComment! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@addComment")
  editQuestionComment(id: ID!, text: String!): QuestionComment! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@editComment")
  deleteQuestionComment(id: ID!): Boolean! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@deleteComment")
  voteComment(comment_id: ID!, vote: Int!): QuestionComment! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@voteComment")
  reportQuestion(question_id: ID!, reason: String!, description: String): Boolean! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@report")
  reportComment(comment_id: ID!, reason: String!): Boolean! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@reportComment")
  syncQuestionHighlights(question_id: ID!, highlights: JSON!): Boolean! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@syncHighlights")
  syncParagraphHighlights(paragraph_id: ID!, highlights: JSON!): Boolean! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@syncParagraphHighlights")

  # Clinical Case Interactions
  syncClinicalCaseHighlights(clinical_case_id: ID!, highlights: JSON!): Boolean!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@syncClinicalCaseHighlights")

  addClinicalCaseNote(
    clinical_case_id: ID!
    text: String
    thumbnail_url: String
  ): ParagraphNote!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\ClinicalCaseNoteResolver@add")

  deleteClinicalCaseNote(id: ID!): Boolean!
    @guard(with: ["sanctum"])
    @field(resolver: "App\\GraphQL\\Mutations\\Learn\\ClinicalCaseNoteResolver@delete")

  # Administrative Content Management
  createModule(name: String!, year: Int!, description: String): Module! @create(model: "App\\Models\\Learn\\Module")
  updateModule(id: ID!, name: String, year: Int, description: String): Module! @update(model: "App\\Models\\Learn\\Module")
  deleteModule(id: ID! @eq): Module @delete(model: "App\\Models\\Learn\\Module")
  createLesson(module_id: ID!, title: String!, order: Int!): Lesson! @create(model: "App\\Models\\Learn\\Lesson")
  updateLesson(id: ID!, title: String, order: Int): Lesson! @update(model: "App\\Models\\Learn\\Lesson")
  deleteLesson(id: ID! @eq): Lesson @delete(model: "App\\Models\\Learn\\Lesson")

