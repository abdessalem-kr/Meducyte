  createParagraph(lesson_id: ID!, title: String, content: String!, order: Int!): LessonParagraph! @create(model: "App\\Models\\Learn\\LessonParagraph")
  updateParagraph(id: ID!, title: String, content: String, order: Int): LessonParagraph! @update(model: "App\\Models\\Learn\\LessonParagraph")
  deleteParagraph(id: ID! @eq): LessonParagraph @delete(model: "App\\Models\\Learn\\LessonParagraph")

