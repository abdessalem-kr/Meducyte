scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")
scalar JSON @scalar(class: "App\\GraphQL\\Scalars\\JSON")

# ──────────────────────────────
# CORE TYPES
# ──────────────────────────────
type Module @model(class: "App\\Models\\Learn\\Module") {
  id: ID!
  name: String!
  description: String
  year: Int!
  lessons: [Lesson!]! @hasMany
  parent: Module @belongsTo
  children: [Module!]! @hasMany
  created_at: DateTime!
  updated_at: DateTime!
  can_access: Boolean! @field(resolver: "App\\GraphQL\\Queries\\Learn\\ModuleResolver@canAccess")
}

type Lesson @model(class: "App\\Models\\Learn\\Lesson") {
  id: ID!
  moduleId: ID! @rename(attribute: "module_id")
  title: String!
  order: Int!
  paragraphs: [LessonParagraph!]! @hasMany
  clinicalCases: [ClinicalCase!]! @hasMany
  module: Module! @belongsTo
  is_studied: Boolean! @field(resolver: "App\\GraphQL\\Queries\\Learn\\LessonResolver@isStudied")
  created_at: DateTime!
  updated_at: DateTime!
}

type LessonParagraph @model(class: "App\\Models\\Learn\\LessonParagraph") {
  id: ID!
  title: String
  content: String!
  order: Int!
  lesson_id: ID @rename(attribute: "lesson_id")
  lessonId: ID @rename(attribute: "lesson_id")
  questions: [Question!]! @hasMany
  has_quiz: Boolean! @field(resolver: "App\\GraphQL\\Queries\\Learn\\ParagraphResolver@hasQuiz")
  my_note: ParagraphNote @field(resolver: "App\\GraphQL\\Queries\\Learn\\ParagraphResolver@myNote")
  my_highlights: JSON @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@myParagraphHighlights")
  created_at: DateTime!
  updated_at: DateTime!
}

type Question @model(class: "App\\Models\\Learn\\Question") {
  id: ID!
  paragraph_id: ID @rename(attribute: "paragraph_id")
  paragraphId: ID @rename(attribute: "paragraph_id")
  lesson_id: ID @rename(attribute: "lesson_id")
  lessonId: ID @rename(attribute: "lesson_id")
  clinical_case_id: ID @rename(attribute: "clinical_case_id")
  clinicalCaseId: ID @rename(attribute: "clinical_case_id")
  text: String!
  source_exam: String
  tags: [String!]
  estimated_time: Int
  approved: Boolean!
  paragraph: LessonParagraph @belongsTo
  lesson: Lesson @belongsTo
  clinicalCase: ClinicalCase @belongsTo(relation: "clinical_case")
  propositions: [Proposition!]! @hasMany
  image_comments: [QuestionImageComment!]! @hasMany
  comments: [QuestionComment!]! @hasMany
  my_highlights: JSON @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@myHighlights")
  saved_by_user: Boolean! @field(resolver: "App\\GraphQL\\Mutations\\Learn\\SavedQuestionResolver@isSaved")
  review: QuestionReview @field(resolver: "App\\GraphQL\\Queries\\Learn\\QuestionResolver@review")
  created_at: DateTime!
  updated_at: DateTime!

  # Metadata for info screen
  lessonTitle: String @method(name: "getLessonTitleAttribute")
  moduleName: String @method(name: "getModuleNameAttribute")
  year: Int @method(name: "getYearAttribute")
}

type Proposition @model(class: "App\\Models\\Learn\\Proposition") {
  id: ID!
  question_id: ID @rename(attribute: "question_id")
  questionId: ID @rename(attribute: "question_id")
  label: String!
  text: String!
  is_correct: Boolean @rename(attribute: "is_correct")
  isCorrect: Boolean @rename(attribute: "is_correct")
  created_at: DateTime!
  updated_at: DateTime!
}

type User @model(class: "App\\Models\\User") {
  id: ID!
  name: String!
  email: String!
  role: String
  year: Int
  mobile: String
  interests: JSON
  learning_goal: String @rename(attribute: "learning_goal")
  activeSubscription: Subscription @hasOne(relation: "activeSubscription")
  created_at: DateTime!
  updated_at: DateTime!
  has_ai_access: Boolean! @method(name: "hasAiAccess")
}

type SubscriptionPlan @model(class: "App\\Models\\SubscriptionPlan") {
  id: ID!
  name: String!
  sku: String!
  price: Float!
  description: String
  duration_months: Int!
  has_ai_access: Boolean!
  access_level: String!
  created_at: DateTime!
  updated_at: DateTime!
}

type Offer @model(class: "App\\Models\\Offer") {
  id: ID!
  code: String!
  discount_percent: Int!
  valid_until: DateTime
  type: String!
  created_at: DateTime!
  updated_at: DateTime!
}

type Subscription @model(class: "App\\Models\\Subscription") {
  id: ID!
  user: User! @belongsTo
  plan: SubscriptionPlan! @belongsTo
  starts_at: DateTime!
  expires_at: DateTime!
  status: String!
  created_at: DateTime!
  updated_at: DateTime!
}

type QuestionReview @model(class: "App\\Models\\Learn\\QuestionReview") {
  id: ID!
  user_id: ID
  question_id: ID
  interval: Int!
  ease_factor: Float! @rename(attribute: "ease_factor")
  repetition_count: Int! @rename(attribute: "repetition_count")
  next_review: DateTime! @rename(attribute: "next_review")
  last_review: DateTime @rename(attribute: "last_review")
  created_at: DateTime!
  updated_at: DateTime!
}

# ──────────────────────────────
# STUDY GROUPS
# ──────────────────────────────

type StudyGroup @model(class: "App\\Models\\StudyGroup\\StudyGroup") {
    id: ID!
    title: String!
    description: String
    color: String!
    type: String!
    active_quiz_session_id: ID @rename(attribute: "active_quiz_session_id")
    is_admin: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\StudyGroupResolver@isAdmin")
    members: [User!]! @belongsToMany
    messages: [StudyGroupMessage!]! @hasMany
    activeSession: StudyGroupQuizSession @belongsTo(relation: "activeSession")
    created_at: DateTime!
    updated_at: DateTime!
}

type StudyGroupMessage @model(class: "App\\Models\\StudyGroup\\StudyGroupMessage") {
    id: ID!
    study_group_id: ID! @rename(attribute: "study_group_id")
    user: User! @belongsTo
    text: String!
    type: String!
    is_edited: Boolean! @rename(attribute: "is_edited")
    is_mine: Boolean! @field(resolver: "App\\GraphQL\\Resolvers\\StudyGroupResolver@isMessageMine")
    created_at: DateTime!
}

type StudyGroupQuizSession @model(class: "App\\Models\\StudyGroup\\StudyGroupQuizSession") {
    id: ID!
    study_group_id: ID! @rename(attribute: "study_group_id")
    quiz_id: ID! @rename(attribute: "quiz_id")
    title: String
    questions: JSON
    scores: JSON
    status: String!
    seconds_per_question: Int @rename(attribute: "seconds_per_question")
    created_at: DateTime!
}

type ClinicalCase @model(class: "App\\Models\\Learn\\ClinicalCase") {
  id: ID!
  lessonId: ID @rename(attribute: "lesson_id")
  text: String!
  title: String
  lesson: Lesson @belongsTo
  questions: [Question!]! @hasMany
  my_highlights: JSON @field(resolver: "App\\GraphQL\\Mutations\\Learn\\InteractionResolver@myClinicalCaseHighlights")
  my_note: ParagraphNote @field(resolver: "App\\GraphQL\\Mutations\\Learn\\ClinicalCaseNoteResolver@myNote")
}

type ParagraphNote @model(class: "App\\Models\\Learn\\ParagraphNote") {
  id: ID!
  text: String
  google_drive_file_id: String
  google_drive_web_view_link: String
  thumbnail_url: String
  created_at: DateTime!
  updated_at: DateTime!
}

type QuestionImageComment @model(class: "App\\Models\\Learn\\QuestionImageComment") {
  id: ID!
  user: User! @belongsTo
  google_drive_file_id: String!
  google_drive_web_view_link: String!
  thumbnail_url: String
  caption: String
  created_at: DateTime!
}

type QuestionReport @model(class: "App\\Models\\Learn\\QuestionReport") {
  id: ID!
  user_id: ID!
  question_id: ID!
  reason: String!
  description: String
  user: User! @belongsTo
  question: Question! @belongsTo
  created_at: DateTime!
  updated_at: DateTime!
}

type CommentReport @model(class: "App\\Models\\Learn\\CommentReport") {
  id: ID!
  user_id: ID!
  comment_id: ID!
  reason: String!
  status: String
  user: User! @belongsTo
  comment: QuestionComment! @belongsTo(relation: "comment")
  created_at: DateTime!
  updated_at: DateTime!
}

# ──────────────────────────────
# QUERIES – FIXED ID FILTERING
# ──────────────────────────────
type Query {
  me: User @guard(with: ["sanctum"]) @auth
  debugSavedQuestions: String! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\SavedQuestionResolver@debug")
  modules: [Module!]! @all(model: "App\\Models\\Learn\\Module")
  module(id: ID! @eq): Module @find(model: "App\\Models\\Learn\\Module")
  lesson(id: ID! @eq): Lesson @find(model: "App\\Models\\Learn\\Lesson")
  paragraph(id: ID! @eq): LessonParagraph @find(model: "App\\Models\\Learn\\LessonParagraph")
  
  # NEW: Global question filtering
  questions(
    moduleIds: [ID]
    lessonIds: [ID]
    years: [Int]
    sources: [String]
    hasClinicalCase: Boolean
    tags: [String!] @where(operator: "json_contains", column: "tags")
    limit: Int
    offset: Int
  ): [Question!]! @field(resolver: "App\\GraphQL\\Queries\\Learn\\QuestionResolver@filter")

  questionsByIds(ids: [ID!]): [Question!]! @field(resolver: "App\\GraphQL\\Queries\\Learn\\QuestionResolver@filter")

  lessons(moduleId: ID @eq(column: "module_id")): [Lesson!]! @all(model: "App\\Models\\Learn\\Lesson")
  years: [Int!]! @field(resolver: "App\\GraphQL\\Queries\\Learn\\ModuleResolver@years")
  sources: [String!]! @field(resolver: "App\\GraphQL\\Queries\\Learn\\QuestionResolver@sources")

  myReviews: [QuestionReview!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Queries\\Learn\\QuestionResolver@myReviews")
  myQuestionFolders: [QuestionFolder!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\QuestionFolderResolver@myFolders")
  mySavedQuestions: [SavedQuestion!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Mutations\\Learn\\SavedQuestionResolver@mySavedQuestions")
  myNotifications: [Notification!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Queries\\NotificationResolver@myNotifications")
  
  # Admin: List all users
  users: [User!]! @all(model: "App\\Models\\User")

  # Admin: Dashboard Statistics
  adminDashboardStats: AdminDashboardStats! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Queries\\Admin\\DashboardResolver@getStats")

  # Admin: Server Status
  serverStatus: ServerStatus! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Queries\\Admin\\DashboardResolver@getServerStatus")

  # Admin: System Activities
  systemActivities: [SystemActivity!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Queries\\Admin\\DashboardResolver@getActivities")

  # Admin: Reports
  questionReports: [QuestionReport!]! @guard(with: ["sanctum"]) @all(model: "App\\Models\\Learn\\QuestionReport")
  commentReports: [CommentReport!]! @guard(with: ["sanctum"]) @all(model: "App\\Models\\Learn\\CommentReport")

  # NEW: User Search
  searchUsers(query: String!): [User!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Queries\\UserResolver@search")

  # Admin: Clinical Cases
  clinicalCases: [ClinicalCase!]! @guard(with: ["sanctum"]) @all(model: "App\\Models\\Learn\\ClinicalCase")

  # Subscription Queries
  subscriptionPlans: [SubscriptionPlan!]! @all(model: "App\\Models\\SubscriptionPlan")

  # Study Group Queries
  studyGroups: [StudyGroup!]! @all(model: "App\\Models\\StudyGroup\\StudyGroup") @guard(with: ["sanctum"])
  studyGroup(id: ID! @eq): StudyGroup @find(model: "App\\Models\\StudyGroup\\StudyGroup") @guard(with: ["sanctum"])
  studyGroupMessages(groupId: ID!): [StudyGroupMessage!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Resolvers\\StudyGroupResolver@messages")
  activeStudyGroupQuiz(groupId: ID!): StudyGroupQuizSession @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Resolvers\\StudyGroupResolver@activeQuiz")
  activeQuizSessions: [StudyGroupQuizSession!]! @guard(with: ["sanctum"]) @field(resolver: "App\\GraphQL\\Resolvers\\StudyGroupResolver@allActiveQuizzes")
}

type SystemActivity {
  id: ID!
  type: String!
  title: String!
  subtitle: String!
  time: String!
  priority: String!
}

type ServerStatus {
  status: String!
  dbConnection: String!
  memoryUsage: String!
  diskUsage: Float!
  phpVersion: String!
  laravelVersion: String!
  environment: String!
  uptime: String!
}

type AdminDashboardStats {
  totalUsers: Int!
  activeNow: Int!
  totalAdmins: Int!
  totalLessons: Int!
  totalQuestions: Int!
  activeReports: Int!
  userGrowth: String!
  lessonGrowth: String!
  questionAccuracy: String!
}

