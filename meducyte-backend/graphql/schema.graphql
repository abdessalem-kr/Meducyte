  updateClinicalCase(id: ID!, text: String, title: String): ClinicalCase! @guard(with: ["sanctum"]) @update(model: "App\\Models\\Learn\\ClinicalCase")
  deleteClinicalCase(id: ID! @eq): ClinicalCase @guard(with: ["sanctum"]) @delete(model: "App\\Models\\Learn\\ClinicalCase")
