name: meducyte_app
description: "your best medical buddy"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  go_router: ^16.2.4
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.1
  json_annotation: ^4.9.0
  lottie: ^3.1.2
  # Markdown & PDF
  synchronized: ^3.4.0
  pointycastle: ^4.0.0
  pin_code_fields: ^8.0.1
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  phosphor_flutter: ^2.1.0
  google_fonts: ^6.3.0
  device_info_plus: ^12.2.0
  window_size: ^0.1.0
  confetti: ^0.8.0
  liquid_swipe: ^3.1.0
  hugeicons: ^1.1.1
  path_provider: ^2.1.0
  path: ^1.9.0
  equatable: ^2.0.7
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  iconsax: ^0.0.8
  fl_chart: ^0.70.0
  uuid: ^4.5.1
  flutter_quill: ^11.5.0
  pdf: ^3.11.3
  printing: ^5.14.2
  just_audio: ^0.9.36
  flutter_tts: ^4.2.2
  web_socket_channel: ^3.0.1
  collection: ^1.19.0
  image_picker: ^1.2.1
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.2
  home_widget: ^0.7.0
  webview_flutter: ^4.10.0
  freezed_annotation: ^2.4.1
  screenshot: ^3.0.0
  share_plus: ^12.0.1
  image: ^4.8.0
  gal: ^2.3.2
  skeletonizer: ^2.1.3

  
  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/books/
    - assets/translations/
    - assets/data/
    - assets/data/pathologies/
    - assets/avatars/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.ttf
